<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ірина Кайда — Фотограф</title>
<meta name="description" content="Галерея фотографій Ірини Кайди" />
<meta property="og:title" content="Ірина Кайда — Фотограф" />
<meta property="og:description" content="Ваші фотографії готові до перегляду та завантаження" />
<meta property="og:image" content="https://res.cloudinary.com/dthjx6acg/image/upload/v1784405785/site/og-cover.png" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://iryna-kaida-gallery-elf.web.app" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://res.cloudinary.com/dthjx6acg/image/upload/v1784405785/site/og-cover.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,300;0,6..96,400;1,6..96,300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="index.css" />
</head>
<body>

<!-- Загрузка -->
<div id="loading">
  <div class="loading-logo">Ірина <em>Кайда</em></div>
  <div class="loading-bar"></div>
</div>

<!-- Ошибка -->
<div id="error">
  <div class="error-title">Альбом не знайдено</div>
  <div class="error-sub">Перевірте посилання або зверніться до фотографа</div>
</div>

<!-- Основной контент -->
<div id="main">
  <header class="hero">
    <div class="hero-label">Ірина Кайда</div>
    <h1 class="hero-title" id="album-title"></h1>
    <div class="dl-all-wrap">
      <button class="btn-dl-all" id="btn-dl-all" onclick="downloadAll()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/>
        </svg>
        Завантажити всі фото
      </button>
      <span class="btn-note" id="photo-count"></span>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text"></div>
      </div>
    </div>
  </header>

  <main class="gallery-wrap">
    <div class="gallery-grid" id="gallery"></div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lb-close">×</button>
    <button class="lb-nav lb-prev" id="lb-prev">‹</button>
    <img id="lb-img" src="" alt="" />
    <button class="lb-nav lb-next" id="lb-next">›</button>
    <div class="lb-counter" id="lb-counter"></div>
    <a class="dl-single lb-dl-btn" id="lb-dl" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
      Завантажити це фото
    </a>
  </div>

  <footer>
    <strong>© 2026 Ірина Кайда</strong>
    Усі фотографії захищені авторським правом
  </footer>
</div>

<script src="index.js"></script>
</body>
</html>
