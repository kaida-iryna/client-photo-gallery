<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Завантаження...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #faf7f2;
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --text-dark: #2c2520;
    --text-mid: #7a6a5e;
    --text-light: #b8a898;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--cream); color: var(--text-dark); font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0; background: var(--cream);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 999; transition: opacity 0.5s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .loading-logo {
    font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300;
    color: var(--text-dark); letter-spacing: 0.05em; margin-bottom: 32px;
  }
  .loading-logo em { font-style: italic; color: var(--gold); }
  .loading-bar {
    width: 120px; height: 1px; background: var(--gold-light); position: relative; overflow: hidden;
  }
  .loading-bar::after {
    content: ''; position: absolute; left: -40%; top: 0;
    width: 40%; height: 100%; background: var(--gold);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { to { left: 140%; } }

  /* ── ERROR ── */
  #error {
    display: none; position: fixed; inset: 0; background: var(--cream);
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  #error.show { display: flex; }
  .error-title {
    font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300;
    color: var(--text-dark); margin-bottom: 12px;
  }
  .error-sub { font-size: 14px; color: var(--text-light); letter-spacing: 0.05em; }

  /* ── HERO ── */
  #main { display: none; }
  #main.show { display: block; }

  .hero {
    position: relative; text-align: center; padding: 72px 24px 48px; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 1px; height: 48px; background: linear-gradient(to bottom, transparent, var(--gold-light));
  }
  .hero-ornament {
    font-size: 11px; letter-spacing: 0.35em; color: var(--gold); text-transform: uppercase;
    margin-bottom: 18px; opacity: 0; animation: fadeUp 0.9s ease 0.1s forwards;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif; font-size: clamp(44px, 9vw, 84px);
    font-weight: 300; line-height: 1.05; color: var(--text-dark);
    opacity: 0; animation: fadeUp 0.9s ease 0.25s forwards;
  }
  .hero-title em { font-style: italic; color: var(--gold); }
  .hero-sub {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px;
    color: var(--text-mid); margin-top: 12px; opacity: 0; animation: fadeUp 0.9s ease 0.4s forwards;
  }
  .hero-line {
    display: flex; align-items: center; gap: 16px; max-width: 180px; margin: 28px auto 32px;
    opacity: 0; animation: fadeUp 0.9s ease 0.5s forwards;
  }
  .hero-line::before, .hero-line::after { content: ''; flex: 1; height: 1px; background: var(--gold-light); }
  .hero-line span { font-size: 16px; color: var(--gold-light); }

  /* ── DOWNLOAD ALL ── */
  .dl-all-wrap {
    text-align: center; margin-bottom: 48px;
    opacity: 0; animation: fadeUp 0.9s ease 0.6s forwards;
  }
  .btn-dl-all {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--text-dark); color: var(--cream);
    border: none; cursor: pointer;
    font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 400;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 16px 36px; border-radius: 2px;
    transition: background 0.3s, transform 0.2s;
  }
  .btn-dl-all:hover { background: #1a100a; transform: translateY(-1px); }
  .btn-dl-all:disabled { background: #9a8a7e; cursor: not-allowed; transform: none; }
  .btn-dl-all svg { width: 16px; height: 16px; flex-shrink: 0; }
  .btn-note { display: block; margin-top: 10px; font-size: 12px; color: var(--text-light); letter-spacing: 0.05em; }

  /* ── PROGRESS ── */
  .progress-wrap { max-width: 320px; margin: 16px auto 0; display: none; }
  .progress-wrap.visible { display: block; }
  .progress-bar-bg { height: 2px; background: var(--gold-light); border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; width: 0%; transition: width 0.2s ease; }
  .progress-text { font-size: 11px; color: var(--text-light); letter-spacing: 0.1em; text-align: center; margin-top: 8px; }

  /* ── GALLERY ── */
  .gallery-wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px 80px; }
  .masonry { columns: 4; column-gap: 12px; }
  @media (max-width: 1100px) { .masonry { columns: 3; } }
  @media (max-width: 720px)  { .masonry { columns: 2; } }
  @media (max-width: 420px)  { .masonry { columns: 1; } }

  .photo-item {
    break-inside: avoid; margin-bottom: 12px;
    position: relative; overflow: hidden; border-radius: 2px;
    opacity: 0; transform: translateY(16px);
    animation: fadeUp 0.6s ease forwards;
    cursor: pointer;
  }
  .photo-item img { display: block; width: 100%; height: auto; transition: transform 0.55s cubic-bezier(0.25,0.46,0.45,0.94); }
  .photo-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(18,10,6,0.6) 0%, transparent 50%);
    opacity: 0; transition: opacity 0.35s ease;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 16px;
  }
  .photo-item:hover img { transform: scale(1.05); }
  .photo-item:hover .photo-overlay { opacity: 1; }
  .dl-single {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.45);
    color: #fff; text-decoration: none;
    font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 8px 18px; border-radius: 1px;
    backdrop-filter: blur(6px); transition: background 0.25s;
  }
  .dl-single:hover { background: rgba(201,169,110,0.3); border-color: rgba(201,169,110,0.7); }
  .dl-single svg { width: 11px; height: 11px; }

  /* ── LIGHTBOX ── */
  .lightbox {
    position: fixed; inset: 0; background: rgba(14,9,6,0.96);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .lightbox.open { opacity: 1; pointer-events: all; }
  .lightbox img { max-width: 88vw; max-height: 86vh; object-fit: contain; border-radius: 2px; }
  .lb-close {
    position: absolute; top: 20px; right: 24px;
    background: none; border: none; color: rgba(255,255,255,0.45);
    font-size: 32px; cursor: pointer; font-weight: 200; line-height: 1;
    transition: color 0.2s; font-family: 'Jost', sans-serif;
  }
  .lb-close:hover { color: #fff; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: rgba(255,255,255,0.35);
    font-size: 42px; cursor: pointer; font-weight: 200; padding: 16px 20px;
    transition: color 0.2s; font-family: 'Jost', sans-serif; line-height: 1;
  }
  .lb-nav:hover { color: rgba(255,255,255,0.9); }
  .lb-prev { left: 8px; } .lb-next { right: 8px; }
  .lb-counter {
    position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.2em; color: rgba(255,255,255,0.35);
  }
  .lb-dl-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); }

  footer {
    text-align: center; padding: 28px 24px 44px;
    border-top: 1px solid var(--gold-light);
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 15px; color: var(--text-light);
  }
  footer strong {
    display: block; font-family: 'Jost', sans-serif; font-style: normal;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 5px;
  }

  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Загрузка -->
<div id="loading">
  <div class="loading-logo">Ірина <em>Кайда</em></div>
  <div class="loading-bar"></div>
</div>

<!-- Ошибка -->
<div id="error">
  <div class="error-title">Альбом не знайдено</div>
  <div class="error-sub">Перевірте посилання або зверніться до фотографа</div>
</div>

<!-- Основной контент -->
<div id="main">
  <header class="hero">
    <div class="hero-ornament">✦ Фотографії</div>
    <h1 class="hero-title" id="album-title">Завантаження</h1>
    <p class="hero-sub">Натисни на фото, щоб переглянути</p>
    <div class="hero-line"><span>✦</span></div>
    <div class="dl-all-wrap">
      <button class="btn-dl-all" id="btn-dl-all" onclick="downloadAll()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/>
        </svg>
        Завантажити всі фото
      </button>
      <span class="btn-note" id="photo-count"></span>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text"></div>
      </div>
    </div>
  </header>

  <main class="gallery-wrap">
    <div class="masonry" id="gallery"></div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lb-close">×</button>
    <button class="lb-nav lb-prev" id="lb-prev">‹</button>
    <img id="lb-img" src="" alt="" />
    <button class="lb-nav lb-next" id="lb-next">›</button>
    <div class="lb-counter" id="lb-counter"></div>
    <a class="dl-single lb-dl-btn" id="lb-dl" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
      Завантажити це фото
    </a>
  </div>

  <footer>
    <strong>© 2026 Ірина Кайда</strong>
    Усі фотографії захищені авторським правом
  </footer>
</div>

<script>
// ============================================================
// КОНФІГ — Cloudinary
// ============================================================
const CLOUD_NAME = 'dthjx6acg';
// ============================================================

const params  = new URLSearchParams(window.location.search);
const albumId = params.get('a');

function storageUrl(path) {
  return `https://res.cloudinary.com/${CLOUD_NAME}/raw/upload/${path}`;
}

async function init() {
  if (!albumId) { showError(); return; }

  try {
    const resp = await fetch(storageUrl(`albums/${albumId}/photos.json`));
    if (!resp.ok) throw new Error('not found');
    const data = await resp.json();
    buildGallery(data);
  } catch {
    showError();
  }
}

function showError() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error').classList.add('show');
}

let photos = [];
let albumName = '';

function buildGallery(data) {
  photos    = data.photos;
  albumName = data.name;

  // Заголовок
  document.title = albumName;
  const titleEl = document.getElementById('album-title');
  const parts = albumName.split(' ');
  if (parts.length >= 2) {
    titleEl.innerHTML = parts.slice(0, -1).join(' ') + '<br><em>' + parts[parts.length - 1] + '</em>';
  } else {
    titleEl.textContent = albumName;
  }
  document.getElementById('photo-count').textContent = photos.length + ' фотографій';

  // Галерея
  const gallery = document.getElementById('gallery');
  photos.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'photo-item';
    item.style.animationDelay = (0.05 + (i % 12) * 0.04) + 's';

    const img = document.createElement('img');
    img.src = p.thumb;
    img.alt = albumName + ' — фото ' + (i + 1);
    img.loading = 'lazy';

    const overlay = document.createElement('div');
    overlay.className = 'photo-overlay';

    const dlBtn = document.createElement('a');
    dlBtn.className = 'dl-single';
    dlBtn.href = p.full;
    dlBtn.download = p.name || ('photo_' + (i + 1) + '.jpg');
    dlBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg> Завантажити`;
    dlBtn.addEventListener('click', e => e.stopPropagation());

    overlay.appendChild(dlBtn);
    item.appendChild(img);
    item.appendChild(overlay);
    item.addEventListener('click', () => openLightbox(i));
    gallery.appendChild(item);
  });

  // Показать галерею
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('main').classList.add('show');
}

// ── Лайтбокс ──────────────────────────────────────────────
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lb-img');
const lbDl     = document.getElementById('lb-dl');
const lbCounter= document.getElementById('lb-counter');
let current = 0;

function openLightbox(i) {
  current = i;
  lbImg.src = photos[i].full;
  lbDl.href = photos[i].full;
  lbDl.download = photos[i].name || ('photo_' + (i + 1) + '.jpg');
  lbCounter.textContent = (i + 1) + ' / ' + photos.length;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  lbImg.src = '';
}
document.getElementById('lb-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.getElementById('lb-prev').addEventListener('click', e => {
  e.stopPropagation();
  openLightbox((current - 1 + photos.length) % photos.length);
});
document.getElementById('lb-next').addEventListener('click', e => {
  e.stopPropagation();
  openLightbox((current + 1) % photos.length);
});
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLightbox();
  if (e.key === 'ArrowLeft')  openLightbox((current - 1 + photos.length) % photos.length);
  if (e.key === 'ArrowRight') openLightbox((current + 1) % photos.length);
});

// ── Скачать все ────────────────────────────────────────────
async function downloadAll() {
  const btn          = document.getElementById('btn-dl-all');
  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-fill');
  const progressText = document.getElementById('progress-text');

  btn.disabled = true;
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="animation:spin 1s linear infinite"><path d="M12 2a10 10 0 0 1 10 10"/></svg> Готую архів...`;
  progressWrap.classList.add('visible');

  const zip    = new JSZip();
  const folder = zip.folder(albumName);

  for (let i = 0; i < photos.length; i++) {
    try {
      const resp = await fetch(photos[i].full);
      const blob = await resp.blob();
      folder.file(photos[i].name || ('photo_' + (i + 1) + '.jpg'), blob);
    } catch(e) {
      console.warn('Не вдалось завантажити:', photos[i].full);
    }
    const pct = Math.round(((i + 1) / photos.length) * 100);
    progressFill.style.width = pct + '%';
    progressText.textContent = (i + 1) + ' з ' + photos.length + ' фото (' + pct + '%)';
  }

  progressText.textContent = 'Створюю ZIP-архів...';
  const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = albumName + '.zip'; a.click();
  URL.revokeObjectURL(url);

  btn.disabled = false;
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 13l4 4L19 7"/></svg> Готово! Завантажено`;
  progressText.textContent = 'Архів збережено на ваш пристрій';
}

init();
</script>
</body>
</html>
